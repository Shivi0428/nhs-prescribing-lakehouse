[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxlake"
version = "0.3.0"
description = "Bronze/silver/gold lakehouse for the NHSBSA English Prescribing Dataset"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Savita Panwar" }]
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "great_expectations>=1.3,<1.6",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pandas>=2.0",
]

[project.scripts]
rxlake = "rxlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: needs a local Spark + Java install (runs in CI)",
]
